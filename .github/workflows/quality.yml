name: quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # THE APPLIER PROOF STEP BELOW NEEDS TO DIFF AGAINST THE BASE COMMIT,
          # and the default shallow clone has no base commit to diff against.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NOTE: the lint step is intentionally absent. eslint-config-next@16 bundles
      # typescript-eslint, which hard-throws "does not support TS 7.0" against this
      # repo's typescript@^7. Upstream tracking: typescript-eslint issue #10940.
      # Lint is a follow-up ticket and must arrive through a PR.

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # All three boards, one step, one check name. The check name stays `quality`
      # because that is what branch protection requires; a second job would
      # silently be non-required.
      #
      # The phase 3 board is validated here from the commit that creates it, even
      # though no terminal works it yet: the harness in scripts/poc/ still reads
      # the phase 2 board by path and keeps doing so until phase 2 reaches 9 of 9.
      # A board nobody works is exactly the board that rots, and validating it
      # costs one file read.
      - name: Validate boards
        run: node docs/board/validate-board.mjs docs/board/rc-board.json docs/board/rc-board-phase2.json docs/board/rc-board-phase3.json

      # P2-15. The nine DELETE statements aimed at the client's production
      # project are parsed with the real PostgreSQL grammar, here, on every
      # push, with no database and no credentials. The card shipped saying the
      # file was authored but unparsed; this is what closes that sentence.
      # Eight checks, and each one was proved to fail on a mutated copy before
      # this step was added.
      - name: Parse the production reset SQL
        run: npm run check:reset-sql

      # GUARD-01, ruling R-052. Three merge resolutions reached this repository
      # carrying conflict residue and nothing caught any of them: 555b725 put an
      # unparseable board on a branch, d66a28e put two stripped marker tails
      # into docs/LEARNINGS.md and they sat on main until GUARD-01, and PR #94
      # produced four more from the GitHub web editor. A grep for <<<<<<< finds
      # none of these, because the characters it looks for are the characters
      # the bad resolution deleted. This step is the one that does.
      - name: Check for conflict residue
        run: npm run check:conflict-residue

      # P2-17. The committed category vocabulary and the migration that seeded
      # it are two files holding one fact. This compares them in both
      # directions, so an entry renamed in one and not re-exported from the
      # other cannot reach the extraction mapping in P2-09.
      - name: Check the category vocabulary
        run: npm run check:categories

      # P2-19. scripts/ledger-rows-0010-0012.sql is GENERATED from the three
      # migration files whose ledger rows were never written, and it embeds
      # their text, so the words DROP and DELETE appear inside its string
      # literals. This step regenerates it in memory and diffs it against the
      # committed file, then parses the committed file with the real PostgreSQL
      # grammar and asserts what the statements actually are: one transaction
      # opener, four selects, three inserts, all three into
      # supabase_migrations.schema_migrations, and no COMMIT, so the owner
      # decides. A grep cannot tell a statement from a quoted string; this can.
      - name: Check the migration ledger rows
        run: npm run check:ledger-rows

      # CRIT-15, static half. Proves nothing in CI points at production in the
      # first place, and that the guard is still wired into the suite. Deleting
      # the globalSetup line would disable the guard everywhere and break
      # nothing visibly, so that line is asserted here.
      - name: Check CI targets no production project
        run: npm run check:no-prod-target

      # AUT-14. Every migration applied to a throwaway postgres:16 container,
      # unmodified, with no credentials and no network.
      #
      # THIS IS NOT A SECOND VERIFICATION OF THE MIGRATIONS. `supabase db
      # reset` below already applies the same files to a real stack, and the
      # AUT-14 card defaults said for that reason that the tool should stay out
      # of this workflow. THIS STEP GUARDS THE SHIM, NOT THE MIGRATIONS, and
      # that is a different thing the card did not weigh.
      #
      # scripts/poc-free/local-db/shim.sql lists the Supabase objects a bare
      # postgres does not have. The day a migration references an object the
      # shim lacks, `supabase db reset` still passes, because a real stack has
      # every object. The local tool silently stops working and nobody finds
      # out until the next session that needs it, offline, with no credentials,
      # in the middle of proving a destructive statement. That is the exact
      # situation the tool exists for and the worst moment to discover it rotted.
      #
      # Ruling R-060 records this, and the card defaults are amended to match
      # rather than left contradicting the workflow.
      - name: Apply every migration to a bare postgres, unmodified
        run: npm run check:migrations

      # THE APPLIER PROOF, AND IT IS THE ONE PATH-FILTERED STEP IN THIS JOB.
      #
      # Ruling R-084. `npm run prove:applier` builds five throwaway postgres
      # containers and takes minutes, so it runs only when something that could
      # break the applier changed: the applier itself, a migration file, or the
      # local-db shim it proves against.
      #
      # THE FILTER IS COMPUTED HERE RATHER THAN DECLARED AS A WORKFLOW `paths:`
      # KEY, AND THE DIFFERENCE IS THE WHOLE REASON THIS IS SAFE. A `paths:`
      # filter on the workflow would make the ENTIRE `quality` job skip, and
      # GitHub reports a skipped required check as success. CLAUDE.md 3.1 rests
      # on every pull request running every step, so that would silently
      # authorise merging on a check that never executed. A step-level `if:`
      # skips one step and leaves the other twenty-one running and reporting.
      #
      # IT FAILS OPEN. If the base commit cannot be resolved, the proof RUNS.
      # A filter that cannot tell what changed must not conclude "nothing did".
      - name: Decide whether the applier proof must run
        id: applier_scope
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "base commit not resolvable, running the proof rather than assuming nothing changed"
            exit 0
          fi
          CHANGED="$(git diff --name-only "${BASE}" HEAD)"
          echo "changed files against ${BASE}:"
          echo "${CHANGED}"
          if printf '%s\n' "${CHANGED}" | grep -qE '^(scripts/apply-pending-migrations\.|supabase/migrations/|scripts/poc-free/local-db/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prove the migration applier against the Docker shim
        if: steps.applier_scope.outputs.run == 'true'
        run: npm run prove:applier

      # THE 2026-08-31 OUTAGE, MADE UNREPEATABLE.
      #
      # Every screen returned 500 in production, including the dashboard. The
      # cause was not a bad migration, a bad conflict resolution or a weak test:
      # thirteen phase 3 migrations were WRITTEN AND MERGED but NOT APPLIED, and
      # the application code merged alongside them read columns that did not
      # exist yet. listProducts asked for supplier_id, which 0019 adds, and 0019
      # is in the pending register.
      #
      # NOTHING HERE COULD HAVE CAUGHT IT, AND THAT IS THE POINT. Every step in
      # this job runs against a database with ALL migrations applied: the shim
      # applies every file, and `supabase db reset` applies every file. CI can
      # never see the difference between the merged schema and the APPLIED
      # schema. This step can, because it reads docs/migrations/APPLY-LOG.md.
      #
      # It stops asking about a migration the moment P3-27 removes it from the
      # pending register, with no edit to this file.
      - name: Refuse application code that reads unapplied schema
        run: npm run check:pending-schema-reads

      # CRIT-15, runtime half. THE GUARD'S REFUSAL, EXERCISED ON THE CI PATH.
      #
      # CRIT-11 built the guard and proved six exit paths locally. In CI only
      # its PASS path had ever run, because CI always resolves to a local
      # stack. A green run proved the guard does not block a legitimate suite
      # and proved nothing about whether it would stop an illegitimate one.
      #
      # This step hands the guard a production ref and asserts it refuses with
      # exit 2. The ref is already public and already committed in
      # scripts/production-refs.mjs, so this needs no secret and adds no
      # exposure.
      #
      # IT RUNS THE GUARD DIRECTLY AND NOT THE PLAYWRIGHT SUITE. Running the
      # suite against a production URL to watch it refuse would write rows if
      # the guard had already broken, which is the one outcome this card
      # exists to prevent. The guard is a separate process; asserting its exit
      # code is the whole proof.
      # The harness caps, exercised. run.sh cannot run in CI: it takes a lock,
      # sources a secrets file and invokes a model. So the blocks that carry the
      # guarantees are fenced in run.sh and lifted verbatim by this test, which
      # then reproduces a suspend by moving the clock the code reads.
      #
      # It exists because the previous cap looked correct and did nothing. On
      # 2026-08-27 the 45 minute cap did not fire for eight hours forty one, the
      # run reported `capped no`, and three scheduled windows were lost behind
      # the lock it went on holding. Nothing was red. A cap nobody has watched
      # fail is a cap nobody has tested, so this suite also runs the OLD
      # watchdog and REQUIRES it to fail.
      - name: Prove the harness caps enforce  # HARNESS-CAP-PROOF
        run: bash scripts/poc/test-harness-caps.sh

      - name: Prove the production guard refuses  # CRIT-15-REFUSAL-PROOF
        run: |
          set -uo pipefail
          REF="$(node -e "import('./scripts/production-refs.mjs').then(m => console.log(m.PRODUCTION_REFS[0]))")"
          if [ -z "$REF" ]; then
            echo "no production ref available to test the refusal against"
            exit 1
          fi
          echo "handing the guard https://$REF.supabase.co and expecting exit 2"
          set +e
          NEXT_PUBLIC_SUPABASE_URL="https://$REF.supabase.co"           SUPABASE_URL="https://$REF.supabase.co"             node scripts/assert-not-prod.mjs
          CODE=$?
          set -e
          if [ "$CODE" -ne 2 ]; then
            echo "GUARD DID NOT REFUSE: expected exit 2, got $CODE"
            echo "The suite could reach the client's production project."
            exit 1
          fi
          echo "guard refused with exit 2, as required"

      # ----------------------------------------------------------------------
      # End to end, P2-07.
      #
      # EVERYTHING BELOW IS A STEP IN THIS JOB, NOT A SECOND JOB AND NOT A
      # SECOND WORKFLOW. Branch protection names exactly one check, `quality`.
      # A second job would appear green next to it and block nothing.
      #
      # The suite runs against a LOCAL Supabase stack started here, not against
      # the eu-west-1 project. No production credential appears in this file or
      # in repository secrets: the local stack's anon and service keys are the
      # fixed, published demo keys, and they open nothing outside the runner.
      # ----------------------------------------------------------------------

      - name: Start local Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Launch database, auth and storage
        # Which services run is decided by supabase/config.toml, not by flags
        # here: one place to change, and no risk of a renamed container name
        # breaking the workflow.
        run: supabase start

      - name: Apply migrations to the local stack
        # db reset replays supabase/migrations from empty, in file order, which
        # is the same order Ivan applies them by hand. If a migration is broken,
        # CI says so here rather than on the day it is applied for real.
        run: supabase db reset

      - name: Export local Supabase credentials
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/supabase.env
          # shellcheck disable=SC1091
          source /tmp/supabase.env
          {
            echo "SUPABASE_URL=${API_URL}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
          } >> "$GITHUB_ENV"

      # CRIT-17 adds a third account: an auth user with NO profiles row. It is
      # the only way to exercise the redirect loop this card removed, because
      # the loop needed a valid session whose profile lookup came back empty.
      - name: Seed the three test accounts
        env:
          TEST_OWNER_EMAIL: owner@rc-inventory.local
          TEST_OWNER_PASSWORD: ci-owner-pass-8Kq2VxRt
          TEST_MANAGER_EMAIL: manager@rc-inventory.local
          TEST_MANAGER_PASSWORD: ci-manager-pass-4Zw9BnLp
          TEST_NO_PROFILE_EMAIL: fara-profil@rc-inventory.local
          TEST_NO_PROFILE_PASSWORD: ci-noprofile-pass-6Hs3JmQe
        run: |
          set -euo pipefail
          node scripts/seed-test-accounts.mjs
          # P3-04. The outbound destination is a project record now and the
          # picker is required, so the form cannot be filled in an empty
          # database. One client and one project, fixed ids, no DELETE.
          node scripts/seed-test-crm.mjs
          # P3-11. The cost report asserts a total to the leu across two
          # months, and the issue form has no date field, so those rows cannot
          # be built through the screen. Fixed ids, no DELETE.
          node scripts/seed-test-cost.mjs
          # P3-13b. The deviz spec needs a version that is already past draft
          # with lines on it, and a quote written in March against a catalogue
          # that has moved since. The trigger in 0025 refuses a line on a
          # non-draft deviz and the header is frozen after it is sent, so
          # neither row can be built through the screen. Fixed ids, no DELETE.
          node scripts/seed-test-deviz.mjs
          # .env.local is what both the dev server and the Playwright runner
          # read. It is gitignored and exists only on this runner.
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
            echo "TEST_OWNER_EMAIL=${TEST_OWNER_EMAIL}"
            echo "TEST_OWNER_PASSWORD=${TEST_OWNER_PASSWORD}"
            echo "TEST_MANAGER_EMAIL=${TEST_MANAGER_EMAIL}"
            echo "TEST_MANAGER_PASSWORD=${TEST_MANAGER_PASSWORD}"
            echo "TEST_NO_PROFILE_EMAIL=${TEST_NO_PROFILE_EMAIL}"
            echo "TEST_NO_PROFILE_PASSWORD=${TEST_NO_PROFILE_PASSWORD}"
          } > .env.local

      - name: Install Playwright chromium
        # Chromium only. Firefox and WebKit would triple the minutes to
        # re-prove the same application logic on a desktop-only internal tool.
        run: npx playwright install --with-deps chromium

      - name: End to end
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
