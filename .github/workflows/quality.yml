name: quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # THE APPLIER PROOF STEP BELOW NEEDS TO DIFF AGAINST THE BASE COMMIT,
          # and the default shallow clone has no base commit to diff against.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NOTE: the lint step is intentionally absent. eslint-config-next@16 bundles
      # typescript-eslint, which hard-throws "does not support TS 7.0" against this
      # repo's typescript@^7. Upstream tracking: typescript-eslint issue #10940.
      # Lint is a follow-up ticket and must arrive through a PR.

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # All three boards, one step, one check name. The check name stays `quality`
      # because that is what branch protection requires; a second job would
      # silently be non-required.
      #
      # The phase 3 board is validated here from the commit that creates it, even
      # though no terminal works it yet: the harness in scripts/poc/ still reads
      # the phase 2 board by path and keeps doing so until phase 2 reaches 9 of 9.
      # A board nobody works is exactly the board that rots, and validating it
      # costs one file read.
      - name: Validate boards
        run: node docs/board/validate-board.mjs docs/board/rc-board.json docs/board/rc-board-phase2.json docs/board/rc-board-phase3.json

      # AUT-11. A COMMIT WHOSE CARD ID RESOLVES TO NO CARD IS REFUSED.
      #
      # AUT-5 and AUT-6 were built, committed and merged under ids that existed
      # on no board. The board undercounted the work that had been done and
      # nothing was red. It was found by a human reading a log, which is the one
      # detection method this repository cannot schedule.
      #
      # IT READS origin/main, NOT THE BRANCH, and that is deliberate. A branch
      # mid-work legitimately carries commits for a card being authored in the
      # same pull request. Running against HEAD would fire on the normal case and
      # teach everybody to ignore it. The question is whether the RECORD is
      # complete, and the record is main.
      #
      # It self-tests before it reads any history: six fixture cases, each
      # negative one paired with a control that must pass on the same harness, so
      # a fixture that silently fails to run cannot satisfy every assertion while
      # proving nothing.
      - name: Refuse a commit whose card id resolves to no card
        run: npm run check:card-ids

      # EXT-08. THE DOCUMENT URL'S FAILURE CONTRACT, ON BODIES CI CANNOT PRODUCE.
      #
      # tests/e2e/document-url.spec.ts proves the three failure paths end to end,
      # but only against the LOCAL Supabase storage server, and that server does
      # not send the same body as the hosted project: it omits the `code` field
      # entirely. A classifier keyed on `code` passes against the hosted project
      # and fails locally; one keyed only on what the local server sends passes
      # here and fails in production, WITH NOTHING TURNING RED, because CI has no
      # access to the hosted project and must not have any.
      #
      # This step closes that half. It replays the captured bodies of BOTH
      # deployments, copied verbatim from the captures in the card's report, plus
      # the code-to-status pairing that is the contract itself. No network, no
      # database, no secret.
      - name: Prove the document URL failure contract
        run: npm run check:document-url

      # EXT-16. The tolerance arithmetic, on its own, with no database and no
      # browser. NOT PATH-FILTERED: the end-to-end cases prove the rule is wired
      # in, this proves the arithmetic is right, and they fail for different
      # reasons. A filter would skip it on the pull request that edits the
      # formula from somewhere it did not expect.
      - name: Check the reconciliation tolerance
        run: npm run check:reconciliation

      # MERGE IS APPLY ON THIS REPOSITORY, so the destructive-statement boundary
      # is the pull request and not the applier. NOT PATH-FILTERED: it resolves
      # its own file list from the diff, and a workflow-level filter would skip
      # it on exactly the pull request that brings a migration into scope.
      - name: Refuse a migration that removes rows
        run: npm run check:no-destructive-migration

      - name: Prove the destructive-migration check refuses
        run: npm run prove:no-destructive-migration

      # RULE-02. A DUPLICATE RULING ID OR CARD ID FAILS THE BUILD.
      #
      # "Namespaced by author" was doctrine and was enforced by nothing. On
      # 2026-09-01 a TRIAGE branch authored R-083 through R-089 while R-083
      # through R-086 were being authored on main, with COMPLETELY DIFFERENT
      # MEANINGS. The two branches appended to different parts of
      # decisions/inbox.md, so there was NO MERGE CONFLICT to notice, and the
      # only thing that caught it was a human reading both.
      #
      # The check asks two questions. Is any id duplicated within the record, on
      # one board, across boards, or in the inbox. And does this branch REDEFINE
      # an id that origin/main already uses, which is the question that would
      # have caught the incident, because within each side the ids were perfectly
      # unique.
      #
      # It also reads decisions/NEXT-RULING-ID and refuses a counter that has not
      # moved past the ruling just written, because that is the state in which
      # the NEXT author collides.
      - name: Refuse a duplicate ruling id or card id
        run: npm run check:unique-ids

      # And the proof that it refuses. A duplicate check that parses zero ids
      # also reports OK, so each of its refusals is driven against a throwaway
      # git repository with its own origin/main, and each is paired with a
      # control that must pass on the same fixture.
      - name: Prove the duplicate-id check refuses
        run: npm run prove:unique-ids

      # P2-15. The nine DELETE statements aimed at the client's production
      # project are parsed with the real PostgreSQL grammar, here, on every
      # push, with no database and no credentials. The card shipped saying the
      # file was authored but unparsed; this is what closes that sentence.
      # Eight checks, and each one was proved to fail on a mutated copy before
      # this step was added.
      - name: Parse the production reset SQL
        run: npm run check:reset-sql

      # GUARD-01, ruling R-052. Three merge resolutions reached this repository
      # carrying conflict residue and nothing caught any of them: 555b725 put an
      # unparseable board on a branch, d66a28e put two stripped marker tails
      # into docs/LEARNINGS.md and they sat on main until GUARD-01, and PR #94
      # produced four more from the GitHub web editor. A grep for <<<<<<< finds
      # none of these, because the characters it looks for are the characters
      # the bad resolution deleted. This step is the one that does.
      - name: Check for conflict residue
        run: npm run check:conflict-residue

      # P2-17. The committed category vocabulary and the migration that seeded
      # it are two files holding one fact. This compares them in both
      # directions, so an entry renamed in one and not re-exported from the
      # other cannot reach the extraction mapping in P2-09.
      - name: Check the category vocabulary
        run: npm run check:categories

      # P2-19. scripts/ledger-rows-0010-0012.sql is GENERATED from the three
      # migration files whose ledger rows were never written, and it embeds
      # their text, so the words DROP and DELETE appear inside its string
      # literals. This step regenerates it in memory and diffs it against the
      # committed file, then parses the committed file with the real PostgreSQL
      # grammar and asserts what the statements actually are: one transaction
      # opener, four selects, three inserts, all three into
      # supabase_migrations.schema_migrations, and no COMMIT, so the owner
      # decides. A grep cannot tell a statement from a quoted string; this can.
      - name: Check the migration ledger rows
        run: npm run check:ledger-rows

      # CRIT-15, static half. Proves nothing in CI points at production in the
      # first place, and that the guard is still wired into the suite. Deleting
      # the globalSetup line would disable the guard everywhere and break
      # nothing visibly, so that line is asserted here.
      - name: Check CI targets no production project
        run: npm run check:no-prod-target

      # AUT-14. Every migration applied to a throwaway postgres:16 container,
      # unmodified, with no credentials and no network.
      #
      # THIS IS NOT A SECOND VERIFICATION OF THE MIGRATIONS. `supabase db
      # reset` below already applies the same files to a real stack, and the
      # AUT-14 card defaults said for that reason that the tool should stay out
      # of this workflow. THIS STEP GUARDS THE SHIM, NOT THE MIGRATIONS, and
      # that is a different thing the card did not weigh.
      #
      # scripts/poc-free/local-db/shim.sql lists the Supabase objects a bare
      # postgres does not have. The day a migration references an object the
      # shim lacks, `supabase db reset` still passes, because a real stack has
      # every object. The local tool silently stops working and nobody finds
      # out until the next session that needs it, offline, with no credentials,
      # in the middle of proving a destructive statement. That is the exact
      # situation the tool exists for and the worst moment to discover it rotted.
      #
      # Ruling R-060 records this, and the card defaults are amended to match
      # rather than left contradicting the workflow.
      - name: Apply every migration to a bare postgres, unmodified
        run: npm run check:migrations

      # THE APPLIER PROOF, AND IT IS THE ONE PATH-FILTERED STEP IN THIS JOB.
      #
      # Ruling R-084. `npm run prove:applier` builds five throwaway postgres
      # containers and takes minutes, so it runs only when something that could
      # break the applier changed: the applier itself, a migration file, or the
      # local-db shim it proves against.
      #
      # THE FILTER IS COMPUTED HERE RATHER THAN DECLARED AS A WORKFLOW `paths:`
      # KEY, AND THE DIFFERENCE IS THE WHOLE REASON THIS IS SAFE. A `paths:`
      # filter on the workflow would make the ENTIRE `quality` job skip, and
      # GitHub reports a skipped required check as success. CLAUDE.md 3.1 rests
      # on every pull request running every step, so that would silently
      # authorise merging on a check that never executed. A step-level `if:`
      # skips one step and leaves the other twenty-one running and reporting.
      #
      # IT FAILS OPEN. If the base commit cannot be resolved, the proof RUNS.
      # A filter that cannot tell what changed must not conclude "nothing did".
      # PROVE-01 ADDED prove-assertions-can-fail.mjs TO THE SAME GATE AND TO THIS
      # PATTERN. A proof whose own file is not in the filter is a proof that
      # cannot be changed and re-run by the change, which is the failure mode the
      # fail-open branch above exists to avoid, one level up.
      - name: Decide whether the applier proof must run
        id: applier_scope
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "base commit not resolvable, running the proof rather than assuming nothing changed"
            exit 0
          fi
          CHANGED="$(git diff --name-only "${BASE}" HEAD)"
          echo "changed files against ${BASE}:"
          echo "${CHANGED}"
          if printf '%s\n' "${CHANGED}" | grep -qE '^(scripts/apply-pending-migrations\.|supabase/migrations/|scripts/poc-free/local-db/|scripts/poc-free/prove-assertions-can-fail\.)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prove the migration applier against the Docker shim
        if: steps.applier_scope.outputs.run == 'true'
        run: npm run prove:applier

      # PROVE-01. EVERY APPLIER ASSERTION, WATCHED TO FAIL.
      #
      # One postgres container brought to the state the applier leaves behind,
      # then per assertion: a CONTROL that must hold on a correct database and a
      # PERTURBATION that must raise. Both halves are required. A body that
      # raises on everything passes the perturbation and fails the control; a
      # body that raises on nothing passes the control and fails the
      # perturbation. Only one that does both is doing its job.
      #
      # The bodies are read from the applier through RC_APPLY_PRINT_ASSERTIONS,
      # so what is proved is the SHIPPED text and not a copy that can drift.
      #
      # It rides the same path filter as the applier proof above: both build
      # containers and both are about the same file.
      - name: Prove every applier assertion can fail
        if: steps.applier_scope.outputs.run == 'true'
        run: npm run prove:assertions

      # THE 2026-08-31 OUTAGE, MADE UNREPEATABLE.
      #
      # Every screen returned 500 in production, including the dashboard. The
      # cause was not a bad migration, a bad conflict resolution or a weak test:
      # thirteen phase 3 migrations were WRITTEN AND MERGED but NOT APPLIED, and
      # the application code merged alongside them read columns that did not
      # exist yet. listProducts asked for supplier_id, which 0019 adds, and 0019
      # is in the pending register.
      #
      # NOTHING HERE COULD HAVE CAUGHT IT, AND THAT IS THE POINT. Every step in
      # this job runs against a database with ALL migrations applied: the shim
      # applies every file, and `supabase db reset` applies every file. CI can
      # never see the difference between the merged schema and the APPLIED
      # schema. This step can, because it reads docs/migrations/APPLY-LOG.md.
      #
      # It stops asking about a migration the moment P3-27 removes it from the
      # pending register, with no edit to this file.
      - name: Refuse application code that reads unapplied schema
        run: npm run check:pending-schema-reads

      # THE OTHER DIRECTION, AND IT COST ITS OWN OUTAGE. Card P3-11c.
      #
      # The step above guards ADDITIVE drift: merged code reading schema that is
      # not applied yet. That is INC-05. It cannot guard the reverse, by
      # construction: when a migration REMOVES something, the code still reading
      # it is already on main and the register is about to be cleared, so there
      # is nothing for that check to compare.
      #
      # INC-06, 2026-09-01: migration 0027 dropped products.supplier_name while
      # deployed code still selected it, and six screens answered 500.
      #
      # This step asks the other question, and it enumerates readers against the
      # TABLE rather than grepping the column name with exclusions, because that
      # exact filter hid lib/data/extraction-actions.ts:269 during P3-05b.
      - name: Refuse a removal while something still reads it
        run: npm run check:removal-safety

      # BOTH OUTAGES, RECONSTRUCTED, EACH FAILING ITS OWN GUARD ON DEMAND.
      # Neither guard had ever been seen to fail anywhere except production.
      # P3-11e. THE DEPLOYED HALF OF THE ORDERING RULE, AND ITS REFUSALS.
      #
      #   an ADDITIVE migration applies BEFORE the code that reads it merges
      #   a REMOVAL migration applies AFTER the code that stops reading it is
      #                            merged AND DEPLOYED
      #
      # check:removal-safety proves MERGED. check-deployed-commit proves DEPLOYED:
      # it asks /api/health which commit production is running and refuses unless
      # git says the commit being applied against is an ancestor of it. It replaces
      # RC_DEPLOY_CONFIRMED, which was an operator statement standing in for a
      # fact, and an operator statement is what produced INC-06.
      #
      # THE CHECK ITSELF IS NOT RUN HERE, and it must not be: a pull request
      # branch is not deployed and never will be, so it would fail on every green
      # run and be switched off within a week. What runs here is the PROOF that
      # its eleven refusals fire, against a fake health route on 127.0.0.1, each
      # paired with a control that must pass on the same harness. No network
      # beyond loopback, no credentials, no production.
      - name: Prove the deployed-commit guard refuses
        run: npm run prove:deployed-commit

      # PROVE-01. AN ASSERTION WITH NO FAILING CASE FAILS THE BUILD.
      #
      # Three defects of one class were found in these guards on 2026-09-02.
      # Three assertions in prove-applier read a psql boolean with includes("t")
      # against a column named `untouched` and matched the COLUMN NAME. Two
      # entries in the applier's assertion list had `raise notice` as their only
      # statement, so they COULD NOT FAIL, and were counted in "N assertions
      # passed" and in the row written to docs/PRODUCTION-WRITES.md.
      #
      # docs/ASSERTION-REGISTER.md names every assertion and refusal in the four
      # guards together with the case that proves it can fail. This step keeps
      # the register honest in both directions: an assertion with no row, a row
      # naming an assertion that is gone, and a row whose case is NONE all fail.
      #
      # It needs no database and no network.
      - name: Refuse an assertion with no failing case
        run: npm run check:assertion-register

      - name: Prove both schema-direction guards still fire
        run: npm run prove:schema-direction

      # CRIT-15, runtime half. THE GUARD'S REFUSAL, EXERCISED ON THE CI PATH.
      #
      # CRIT-11 built the guard and proved six exit paths locally. In CI only
      # its PASS path had ever run, because CI always resolves to a local
      # stack. A green run proved the guard does not block a legitimate suite
      # and proved nothing about whether it would stop an illegitimate one.
      #
      # This step hands the guard a production ref and asserts it refuses with
      # exit 2. The ref is already public and already committed in
      # scripts/production-refs.mjs, so this needs no secret and adds no
      # exposure.
      #
      # IT RUNS THE GUARD DIRECTLY AND NOT THE PLAYWRIGHT SUITE. Running the
      # suite against a production URL to watch it refuse would write rows if
      # the guard had already broken, which is the one outcome this card
      # exists to prevent. The guard is a separate process; asserting its exit
      # code is the whole proof.
      # The harness caps, exercised. run.sh cannot run in CI: it takes a lock,
      # sources a secrets file and invokes a model. So the blocks that carry the
      # guarantees are fenced in run.sh and lifted verbatim by this test, which
      # then reproduces a suspend by moving the clock the code reads.
      #
      # It exists because the previous cap looked correct and did nothing. On
      # 2026-08-27 the 45 minute cap did not fire for eight hours forty one, the
      # run reported `capped no`, and three scheduled windows were lost behind
      # the lock it went on holding. Nothing was red. A cap nobody has watched
      # fail is a cap nobody has tested, so this suite also runs the OLD
      # watchdog and REQUIRES it to fail.
      - name: Prove the harness caps enforce  # HARNESS-CAP-PROOF
        run: bash scripts/poc/test-harness-caps.sh

      # ASK-01 and DIGEST-01. Both cards are about the system being honest when
      # nobody is watching, and every guarantee in them fails SILENTLY when it
      # breaks: a deadline that never fires looks like a question nobody
      # answered, a recommendation taken on silence looks like an approval, and
      # a reply accepted from the wrong sender looks like a reply.
      #
      # It runs the REAL ask.sh end to end in a throwaway git repository: the
      # real deadline loop against a shadowed clock, the real spool, the real
      # board write, the real board validator, the real commit and the real exit
      # codes. The single HTTPS call is redirected to a file through a
      # documented seam, because that is the only part that cannot run on a
      # runner with no credentials.
      #
      # EVERY ASSERTION THAT COULD PASS VACUOUSLY IS PROVED TO FAIL AGAINST A
      # MUTATED COPY, and each mutant is itself proved to RUN first, against an
      # unmutated control in the same scratch tree. Without that control, a
      # mutant that merely fails to load passes every mutation case while
      # proving nothing, which is what the first draft of this suite did on all
      # three of its mutants at once.
      # P3-11b. THE INSTALLER IS PROVED BY INSTALLING AND THEN INVOKING.
      #
      # DIGEST-01 shipped digest.sh, its launchd plist, and the lines in
      # install.sh that deploy both, and every one of them was proved by a test
      # that ran the SOURCE. Nobody ran the installer. A day after it merged,
      # `bash /Users/ivan/rc-poc-bin/digest.sh --force` still answered "No such
      # file or directory": the 08:00 and 19:00 agent did not exist, and the code
      # to create it had been on main the whole time.
      #
      # A test that runs the source proves the source. It says nothing about
      # whether the file reached the place the scheduler looks. That is the same
      # class as a migration that is merged and never applied.
      #
      # It installs into a TEMPORARY PREFIX and then invokes what it installed.
      # No launchctl, no plutil, no network, no credentials: the digest's one
      # HTTPS call goes through the documented POC_DIGEST_OUTBOX seam. It never
      # writes under /Users/ivan, and one of its assertions is exactly that.
      - name: Prove the installer by installing and invoking  # P3-11B-INSTALL-PROOF
        run: bash scripts/poc/test-install.sh

      - name: Prove the question channel and the scheduled digest  # ASK-01-DIGEST-01-PROOF
        run: bash scripts/poc/test-ask-digest.sh

      # AUT-16. THE BOARD SET, AND EVERY COMPONENT THAT RESOLVES AGAINST IT.
      #
      # Three components each held their own hardcoded path to the phase 2
      # board while every run since 2026-08-30 worked the phase 3 board: the
      # Telegram answer channel refused every phase 3 card id, the digest
      # counted shipped cards and the launch gate off a board nobody was
      # working, and the eligible-card selector, the silence rule and the claim
      # writer all computed against that same board.
      #
      # Every half runs the REAL function, and every half carries a failing case
      # built by handing that same function ONE board. A test that only proved
      # the new behaviour could not notice a repoint back to a single board,
      # which is the regression this step exists to catch.
      #
      # No network, no credentials, no database: two fixture boards in a
      # temporary directory and the shell parsers.
      - name: Prove the board set is the union of the boards  # AUT-16-BOARD-SET-PROOF
        run: bash scripts/poc/test-board-set.sh

      - name: Prove the production guard refuses  # CRIT-15-REFUSAL-PROOF
        run: |
          set -uo pipefail
          REF="$(node -e "import('./scripts/production-refs.mjs').then(m => console.log(m.PRODUCTION_REFS[0]))")"
          if [ -z "$REF" ]; then
            echo "no production ref available to test the refusal against"
            exit 1
          fi
          echo "handing the guard https://$REF.supabase.co and expecting exit 2"
          set +e
          NEXT_PUBLIC_SUPABASE_URL="https://$REF.supabase.co"           SUPABASE_URL="https://$REF.supabase.co"             node scripts/assert-not-prod.mjs
          CODE=$?
          set -e
          if [ "$CODE" -ne 2 ]; then
            echo "GUARD DID NOT REFUSE: expected exit 2, got $CODE"
            echo "The suite could reach the client's production project."
            exit 1
          fi
          echo "guard refused with exit 2, as required"

      # ----------------------------------------------------------------------
      # End to end, P2-07.
      #
      # EVERYTHING BELOW IS A STEP IN THIS JOB, NOT A SECOND JOB AND NOT A
      # SECOND WORKFLOW. Branch protection names exactly one check, `quality`.
      # A second job would appear green next to it and block nothing.
      #
      # The suite runs against a LOCAL Supabase stack started here, not against
      # the eu-west-1 project. No production credential appears in this file or
      # in repository secrets: the local stack's anon and service keys are the
      # fixed, published demo keys, and they open nothing outside the runner.
      # ----------------------------------------------------------------------

      - name: Start local Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Launch database, auth and storage
        # Which services run is decided by supabase/config.toml, not by flags
        # here: one place to change, and no risk of a renamed container name
        # breaking the workflow.
        run: supabase start

      - name: Apply migrations to the local stack
        # db reset replays supabase/migrations from empty, in file order, which
        # is the same order Ivan applies them by hand. If a migration is broken,
        # CI says so here rather than on the day it is applied for real.
        run: supabase db reset

      - name: Export local Supabase credentials
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/supabase.env
          # shellcheck disable=SC1091
          source /tmp/supabase.env
          {
            echo "SUPABASE_URL=${API_URL}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
          } >> "$GITHUB_ENV"

      # CRIT-17 adds a third account: an auth user with NO profiles row. It is
      # the only way to exercise the redirect loop this card removed, because
      # the loop needed a valid session whose profile lookup came back empty.
      - name: Seed the three test accounts
        env:
          TEST_OWNER_EMAIL: owner@rc-inventory.local
          TEST_OWNER_PASSWORD: ci-owner-pass-8Kq2VxRt
          TEST_MANAGER_EMAIL: manager@rc-inventory.local
          TEST_MANAGER_PASSWORD: ci-manager-pass-4Zw9BnLp
          TEST_NO_PROFILE_EMAIL: fara-profil@rc-inventory.local
          TEST_NO_PROFILE_PASSWORD: ci-noprofile-pass-6Hs3JmQe
        run: |
          set -euo pipefail
          node scripts/seed-test-accounts.mjs
          # P3-04. The outbound destination is a project record now and the
          # picker is required, so the form cannot be filled in an empty
          # database. One client and one project, fixed ids, no DELETE.
          node scripts/seed-test-crm.mjs
          # P3-11. The cost report asserts a total to the leu across two
          # months, and the issue form has no date field, so those rows cannot
          # be built through the screen. Fixed ids, no DELETE.
          node scripts/seed-test-cost.mjs
          # P3-13b. The deviz spec needs a version that is already past draft
          # with lines on it, and a quote written in March against a catalogue
          # that has moved since. The trigger in 0025 refuses a line on a
          # non-draft deviz and the header is frozen after it is sent, so
          # neither row can be built through the screen. Fixed ids, no DELETE.
          node scripts/seed-test-deviz.mjs
          # .env.local is what both the dev server and the Playwright runner
          # read. It is gitignored and exists only on this runner.
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
            echo "TEST_OWNER_EMAIL=${TEST_OWNER_EMAIL}"
            echo "TEST_OWNER_PASSWORD=${TEST_OWNER_PASSWORD}"
            echo "TEST_MANAGER_EMAIL=${TEST_MANAGER_EMAIL}"
            echo "TEST_MANAGER_PASSWORD=${TEST_MANAGER_PASSWORD}"
            echo "TEST_NO_PROFILE_EMAIL=${TEST_NO_PROFILE_EMAIL}"
            echo "TEST_NO_PROFILE_PASSWORD=${TEST_NO_PROFILE_PASSWORD}"
          } > .env.local

      - name: Install Playwright chromium
        # Chromium only. Firefox and WebKit would triple the minutes to
        # re-prove the same application logic on a desktop-only internal tool.
        run: npx playwright install --with-deps chromium

      - name: End to end
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
